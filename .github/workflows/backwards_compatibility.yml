name: Backwards compatibility tests
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main

env:
  MAIN_PYTHON_VERSION: '3.14'
  ANSRV_GEO_IMAGE: 'ghcr.io/ansys/geometry'
  ANSRV_GEO_PORT: 700
  ANSRV_GEO_LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
  GEO_CONT_NAME: ans_geo
  IS_WORKFLOW_RUNNING: True

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # Needs access to the Geometry docker image

jobs:

  # =================================================================================================
  # vvvvvvvvvvvvvvvvvvvvvvvvvvvvvv    RUNNING ON SELF-HOSTED RUNNER    vvvvvvvvvvvvvvvvvvvvvvvvvvvvvv
  # =================================================================================================

  testing-backwards-compatibility-windows-old-images:
    name: Windows ${{ matrix.backend-version }}
    runs-on: [self-hosted, Windows, pygeometry]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-tag: "windows-24.2"
            backend-version: "24.2"
          - image-tag: "windows-25.1"
            backend-version: "25.1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3

      - name: Create Python venv
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1

      - name: Install packages for testing
        run: |
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install --upgrade build wheel
          pip install . --group tests

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Geometry service container (if needed)
        env:
          FULL_IMAGE_NAME: "${{ env.ANSRV_GEO_IMAGE }}:${{ matrix.image-tag }}"
        run: |
          Write-Host "Pulling Docker image: $env:FULL_IMAGE_NAME"
          docker pull $env:FULL_IMAGE_NAME

      - name: Check location of self-hosted runner and define license server accordingly
        if: runner.name == 'pygeometry-ci-2'
        env:
          LICENSE_SERVER_INTERNAL: ${{ secrets.LICENSE_SERVER_INTERNAL }}
        run: |
          echo "ANSRV_GEO_LICENSE_SERVER=$env:LICENSE_SERVER_INTERNAL" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stop any running containers
        run: |
          $dockerContainers = docker ps -a -q
          if (-not [string]::IsNullOrEmpty($dockerContainers)) {
              docker stop $dockerContainers
              docker rm $dockerContainers
          }

      - name: Define SERVER_ENDPOINT variable if needed
        if: matrix.backend-version == '24.2' || matrix.backend-version == '25.1'
        run: |
          $env:SERVER_ENDPOINT = "-e SERVER_ENDPOINT=50051@0.0.0.0"
          echo "SERVER_ENDPOINT variable set to: $env:SERVER_ENDPOINT"
          echo "SERVER_ENDPOINT=$env:SERVER_ENDPOINT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Start Geometry service and verify start
        env:
          FULL_IMAGE_NAME: "${{ env.ANSRV_GEO_IMAGE }}:${{ matrix.image-tag }}"
          PORT_MAPPING: "${{ env.ANSRV_GEO_PORT }}:50051"
          TRANSPORT_MODE_SELECTION: ${{ secrets.TRANSPORT_MODE_SELECTION }}
        run: |
          .\.venv\Scripts\Activate.ps1
          # Write command to file launch.txt for sanitizing purposes
          echo "docker run --detach --name $env:GEO_CONT_NAME -e LICENSE_SERVER=$env:ANSRV_GEO_LICENSE_SERVER $env:SERVER_ENDPOINT -p $env:PORT_MAPPING $env:FULL_IMAGE_NAME $env:TRANSPORT_MODE_SELECTION" | Out-File -FilePath launch.txt
          # Read the file and execute the command
          $command = Get-Content -Path launch.txt | Select-String -Pattern "docker run"
          Invoke-Expression $command.Line
          Start-Sleep -Seconds 10
          python -c "from ansys.geometry.core.connection.validate import validate; validate()"

      - name: Testing
        id: pytest
        timeout-minutes: 20 # On Windows self-hosted runners, sometimes hangs on cleanup after all tests pass
        continue-on-error: true
        env:
          BACKEND_VERSION: ${{ matrix.backend-version }}
        run: |
          .\.venv\Scripts\Activate.ps1
          # These older images only support proto v0, so no need to loop over proto versions here
          pytest -v --backwards-compatibility=yes --backend-version=$env:BACKEND_VERSION --proto-version=v0 -rf --junit-xml=test-results.xml

      - name: Fail if tests actually failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

      - name: Check test results on timeout
        if: steps.pytest.outcome == 'cancelled'
        run: |
          if (-not (Test-Path test-results.xml)) {
            Write-Error "No test results found - pytest was killed before writing results"
            exit 1
          }
          $failures = (Select-Xml -Path test-results.xml -XPath '//testsuite/@failures' | ForEach-Object { [int]$_.Node.Value } | Measure-Object -Sum).Sum
          $errors = (Select-Xml -Path test-results.xml -XPath '//testsuite/@errors' | ForEach-Object { [int]$_.Node.Value } | Measure-Object -Sum).Sum
          if (($failures + $errors) -gt 0) {
            Write-Error "$failures failures and $errors errors found before timeout"
            exit 1
          }
          Write-Output "No failures found in test results before timeout"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: .cov/xml

      - name: Stop the Geometry service
        if: always()
        run: |
          docker stop $env:GEO_CONT_NAME
          docker logs $env:GEO_CONT_NAME
          docker rm $env:GEO_CONT_NAME

      - name: Stop any remaining containers
        if: always()
        run: |
          $dockerContainers = docker ps -a -q
          if (-not [string]::IsNullOrEmpty($dockerContainers)) {
              docker stop $dockerContainers
              docker rm $dockerContainers
          }

  # =================================================================================================
  # ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^    RUNNING ON SELF-HOSTED RUNNER    ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
  # =================================================================================================

  testing-backwards-compatibility-windows:
    name: Windows ${{ matrix.backend-version }}
    runs-on: ${{ matrix.windows-runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-tag: "core-windows-25.2"
            backend-version: "25.2"
            windows-runner: "windows-2025"
            proto-version: "v0"
          - image-tag: "core-windows-26.1"
            backend-version: "26.1"
            windows-runner: "windows-2025"
            proto-version: "v1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          activate-environment: true
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install packages for testing
        run: uv sync --group tests

      - name: Download Geometry service container (if needed)
        env:
          FULL_IMAGE_NAME: "${{ env.ANSRV_GEO_IMAGE }}:${{ matrix.image-tag }}"
        run: |
          Write-Host "Pulling Docker image: $env:FULL_IMAGE_NAME"
          docker pull $env:FULL_IMAGE_NAME

      - name: Start Geometry service and verify start
        env:
          FULL_IMAGE_NAME: "${{ env.ANSRV_GEO_IMAGE }}:${{ matrix.image-tag }}"
          PORT_MAPPING: "${{ env.ANSRV_GEO_PORT }}:50051"
          TRANSPORT_MODE_SELECTION: ${{ secrets.TRANSPORT_MODE_SELECTION }}
        run: |
          # Write command to file launch.txt for sanitizing purposes
          echo "docker run --detach --name $env:GEO_CONT_NAME -e LICENSE_SERVER=$env:ANSRV_GEO_LICENSE_SERVER $env:SERVER_ENDPOINT -p $env:PORT_MAPPING $env:FULL_IMAGE_NAME $env:TRANSPORT_MODE_SELECTION" | Out-File -FilePath launch.txt
          # Read the file and execute the command
          $command = Get-Content -Path launch.txt | Select-String -Pattern "docker run"
          Invoke-Expression $command.Line
          Start-Sleep -Seconds 10
          python -c "from ansys.geometry.core.connection.validate import validate; validate()"

      - name: Testing
        timeout-minutes: 20 # Sometimes hangs...
        env:
          BACKEND_VERSION: ${{ matrix.backend-version }}
          PROTO_VERSION: ${{ matrix.proto-version }}
        run: |
          uv run pytest -v --backwards-compatibility=yes --backend-version=$env:BACKEND_VERSION --proto-version=$env:PROTO_VERSION -rf

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: .cov/xml

      - name: Stop the Geometry service
        if: always()
        run: |
          docker stop $env:GEO_CONT_NAME
          docker logs $env:GEO_CONT_NAME
          docker rm $env:GEO_CONT_NAME
